# Routage interne izipush. Le TLS se termine en amont (ALB, CloudFront ou proxy) ;
# ce fichier ne fait que répartir vers les quatre services exposés.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  # Taille des pièces jointes acceptées par l'API.
  client_max_body_size 25m;

  # L'API expose ses propres chemins /v1 : le slash final retire le préfixe /api
  # avant transmission. Le retirer casserait toutes les routes.
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # WebSocket : connexions longues. Sans le délai allongé, le proxy coupe les
  # abonnés toutes les 60 secondes et le client se reconnecte en boucle.
  location /socket.io/ {
    proxy_pass http://ws:3002;
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Tout le reste : l'interface d'administration.
  location / {
    proxy_pass http://dashboard:4000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }
}
